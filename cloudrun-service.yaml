apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/ingress-status: all
  name: vanatvam-backend
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/maxScale: '10'
        autoscaling.knative.dev/minScale: '1'
        run.googleapis.com/startup-cpu-boost: 'true'
    spec:
      containerConcurrency: 80
      containers:
      - env:
        - name: DATABASE_URL
          value: postgresql://neondb_owner:npg_KcizJ6GeU2lt@ep-plain-king-a1mv0lof-pooler.ap-southeast-1.aws.neon.tech/vanatvam?sslmode=require
        - name: SECRET_KEY
          value: j5uaRVtNbg1dmZLKkoETt03a6Z2YLBMWb8QJyzAndpc
        - name: ALGORITHM
          value: HS256
        - name: ACCESS_TOKEN_EXPIRE_MINUTES
          value: '30'
        image: asia-south1-docker.pkg.dev/vanatvam-booking-app/vanatvam-repo/backend:latest
        startupProbe:
          initialDelaySeconds: 30
          failureThreshold: 3
          periodSeconds: 10
          tcpSocket:
            port: 8000
          timeoutSeconds: 10
        ports:
        - containerPort: 8000
          name: http1
        resources:
          limits:
            cpu: '1'
            memory: 512Mi
      serviceAccountName: 57399834436-compute@developer.gserviceaccount.com
      timeoutSeconds: 300
  traffic:
  - latestRevision: true
    percent: 100
